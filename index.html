<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SubQR Hub - 通用二维码生成器</title>
    <!-- Favicon - QR Code Style -->
    <link rel="icon" type="image/svg+xml" href="qr.svg?v=2">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://fonts.gstatic.loli.net" crossorigin>
    <link rel="preconnect" href="https://cdn.bootcdn.net">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('matrixqr-theme');
                var light = t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches);
                document.documentElement.classList.toggle('light', light);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <img class="logo" src="qr.svg?v=2" alt="SubQR Hub" width="108" height="108">
                <div class="brand-text">
                    <p class="eyebrow">本地二维码工具</p>
                    <h1>SubQR Hub</h1>
                </div>
            </div>
            <p class="subtitle">把文本、网络与联系信息快速转换为可扫描的二维码。</p>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题：浅色 / 深色 / 跟随系统" title="点击切换：浅色 → 深色 → 跟随系统">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </button>
        </div>

        <div class="card">
            <div class="composer-panel">
                <!-- 模板标签页 -->
                <div class="template-tabs" role="tablist" aria-label="选择二维码类型">
                <button class="tab-btn active" id="tab-text" data-template="text" role="tab" aria-selected="true" aria-controls="form-text">
                    <span aria-hidden="true">📝</span> 文本
                </button>
                <button class="tab-btn" id="tab-wifi" data-template="wifi" role="tab" aria-selected="false" aria-controls="form-wifi">
                    <span aria-hidden="true">📶</span> WiFi
                </button>
                <button class="tab-btn" id="tab-email" data-template="email" role="tab" aria-selected="false" aria-controls="form-email">
                    <span aria-hidden="true">📧</span> 邮件
                </button>
                <button class="tab-btn" id="tab-sms" data-template="sms" role="tab" aria-selected="false" aria-controls="form-sms">
                    <span aria-hidden="true">📱</span> 短信
                </button>
                </div>

                <!-- 模板表单容器 -->
                <div class="template-forms">
                <!-- WiFi 表单 -->
                <div class="template-form" id="form-wifi" role="tabpanel" aria-labelledby="tab-wifi">
                    <div class="form-group">
                        <label for="wifi-ssid">网络名称 (SSID)</label>
                        <input type="text" id="wifi-ssid" placeholder="例如: MyWiFi" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="wifi-password">密码</label>
                        <div class="input-with-toggle">
                            <input type="password" id="wifi-password" placeholder="WiFi 密码" autocomplete="off">
                            <button type="button" class="toggle-password" aria-label="显示密码" data-target="wifi-password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="wifi-encryption">加密类型</label>
                        <select id="wifi-encryption">
                            <option value="WPA">WPA/WPA2/WPA3</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">无密码</option>
                        </select>
                    </div>
                </div>

                <!-- 邮件表单 -->
                <div class="template-form" id="form-email" role="tabpanel" aria-labelledby="tab-email">
                    <div class="form-group">
                        <label for="email-to">收件邮箱 *</label>
                        <input type="email" id="email-to" placeholder="例如: recipient@email.com" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="email-subject">主题</label>
                        <input type="text" id="email-subject" placeholder="邮件主题" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="email-body">正文</label>
                        <textarea id="email-body" placeholder="邮件内容..." rows="3"></textarea>
                    </div>
                </div>

                <!-- 短信表单 -->
                <div class="template-form" id="form-sms" role="tabpanel" aria-labelledby="tab-sms">
                    <div class="form-group">
                        <label for="sms-number">收件号码 *</label>
                        <input type="tel" id="sms-number" placeholder="例如: 13800138000" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="sms-message">短信内容</label>
                        <textarea id="sms-message" placeholder="短信内容..." rows="3"></textarea>
                    </div>
                </div>

                <!-- 文本表单 -->
                <div class="template-form active" id="form-text" role="tabpanel" aria-labelledby="tab-text">
                    <div class="input-label">
                        <span>文本内容</span>
                        <button class="paste-btn" id="paste-btn" title="从剪贴板粘贴" aria-label="从剪贴板粘贴">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                            </svg>
                            粘贴
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <textarea
                            id="sub-input"
                            class="input-area"
                            placeholder="输入文本或链接..."
                            aria-label="文本输入框"
                            aria-describedby="input-hint"></textarea>
                    </div>
                    <div class="shortcut-hint" id="input-hint">
                        <span>快捷键：</span>
                        <kbd>Ctrl</kbd>
                        <span>+</span>
                        <kbd>Enter</kbd>
                        <span>生成二维码</span>
                    </div>
                </div>
                </div>

                <div class="btn-group" role="group" aria-label="操作按钮">
                <button class="generate-btn" id="generate-btn" aria-label="生成二维码">生成二维码</button>
                <button class="clear-btn" id="clear-btn" title="清空内容" aria-label="清空所有内容">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
                </div>
            </div>

            <div class="result-area" id="result-area" role="region" aria-label="二维码生成结果" aria-live="polite">
                <div class="qr-style-picker" id="qr-style-picker" hidden>
                    <label class="qr-style-label" for="qr-style-select">二维码样式</label>
                    <select id="qr-style-select" class="qr-style-select" aria-label="二维码样式"></select>
                </div>
                <div id="qr-result"></div>
            </div>
        </div>

        <footer class="footer">
            <!-- 安全提示 -->
            <div class="security-notice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
                <div class="security-notice-content">
                    <div class="security-notice-title">
                        100% 本地处理，零数据上传
                    </div>
                    <div class="security-notice-desc">
                        所有二维码在<strong>您的浏览器本地生成</strong>，无需服务器，无数据收集，无追踪。您的隐私数据永远不会离开您的设备。
                    </div>
                    <div class="security-features">
                        <span class="security-tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            无需注册
                        </span>
                        <span class="security-tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            纯离线可用
                        </span>
                        <span class="security-tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                            开源代码
                        </span>
                        <span class="security-tag">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            无数据上传
                        </span>
                    </div>
                </div>
            </div>

            <p>&copy; 2026 <a href="https://github.com/zeno528/matrix-qr" target="_blank" rel="noreferrer"><svg class="github-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>matrix-qr</a> · MIT License</p>
        </footer>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="polite">已复制到剪贴板</div>

    <!-- 二维码灯罩 (Lightbox) -->
    <div class="qr-lightbox" id="qr-lightbox" role="dialog" aria-modal="true" aria-label="二维码预览">
        <div class="qr-lightbox-content">
            <canvas class="qr-lightbox-canvas" id="lightbox-canvas"></canvas>
            <img class="qr-lightbox-img" id="lightbox-image" alt="二维码大图，长按保存">
            <p class="qr-lightbox-hint">点击空白处关闭</p>
        </div>
    </div>

    <!-- qrcode-generator: 支持超长内容的二维码库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
