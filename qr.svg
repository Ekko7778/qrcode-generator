<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 白色圆角背景 -->
  <rect width="80" height="80" rx="16" fill="#ffffff"/>
  <!-- 定位角标 ×3（标准回字形，二维码核心元素，留 8px 安全区） -->
  <rect x="8" y="8" width="28" height="28" rx="4" fill="#1e1b4b"/>
  <rect x="12" y="12" width="20" height="20" fill="#ffffff"/>
  <rect x="16" y="16" width="12" height="12" rx="2.5" fill="#1e1b4b"/>
  <rect x="44" y="8" width="28" height="28" rx="4" fill="#1e1b4b"/>
  <rect x="48" y="12" width="20" height="20" fill="#ffffff"/>
  <rect x="52" y="16" width="12" height="12" rx="2.5" fill="#1e1b4b"/>
  <rect x="8" y="44" width="28" height="28" rx="4" fill="#1e1b4b"/>
  <rect x="12" y="48" width="20" height="20" fill="#ffffff"/>
  <rect x="16" y="52" width="12" height="12" rx="2.5" fill="#1e1b4b"/>
  <!-- 数据模块：模拟真实QR数据区稀疏采样（有逻辑的分布，非纯随机） -->
  <!-- 上排（右上角标下方） -->
  <rect x="36" y="30" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="44" y="30" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="56" y="30" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="68" y="30" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <!-- 中排 -->
  <rect x="40" y="38" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="52" y="38" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="60" y="38" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="68" y="38" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <!-- 下排（右下角区域，平衡视觉） -->
  <rect x="36" y="46" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="44" y="46" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="56" y="46" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="68" y="46" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="40" y="54" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="48" y="54" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="60" y="54" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="68" y="54" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="36" y="62" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="44" y="62" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="52" y="62" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="64" y="62" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="40" y="70" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="52" y="70" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="60" y="70" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="68" y="70" width="4" height="4" rx="1" fill="#1e1b4b"/>
  <rect x="64" y="54" width="4" height="4" rx="1" fill="#1e1b4b"/>
</svg>